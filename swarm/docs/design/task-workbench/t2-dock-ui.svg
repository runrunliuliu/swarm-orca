<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="dockGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.06"/>
    </linearGradient>
    <style>
      .t { fill: #111827; }
      .m { fill: #6b7280; }
      .s { fill: #94a3b8; }
      .h1 { font-size: 15px; font-weight: 600; }
      .h2 { font-size: 12px; font-weight: 600; }
      .b { font-size: 12px; }
      .sm { font-size: 10px; }
      .xs { font-size: 9px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .panel { fill: #ffffff; stroke: #e4e7ec; stroke-width: 1; }
      .card { fill: #ffffff; stroke: #e4e7ec; stroke-width: 1; }
      .hair { stroke: #eef0f3; stroke-width: 1; }
      .cap { font-size: 11px; font-weight: 600; fill: #475569; letter-spacing: .3px; }
      .num { fill: #2563eb; }
      .numtext { fill: #ffffff; font-size: 9px; font-weight: 700; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="800" fill="#f6f7f9"/>

  <!-- ============ Panel A: list page ============ -->
  <text x="32" y="46" class="cap">① 列表页 · dock 折叠态（页面级，列表卡片外）</text>

  <rect x="32" y="56" width="780" height="650" rx="12" class="panel"/>

  <!-- sidebar -->
  <rect x="32" y="56" width="200" height="650" rx="12" fill="#fbfbfc"/>
  <rect x="32" y="56" width="200" height="650" rx="12" fill="none" stroke="#e4e7ec"/>
  <path d="M 232 56 L 232 706" stroke="#e4e7ec"/>

  <text x="48" y="86" class="h1 t">Orca</text>

  <rect x="42" y="100" width="180" height="26" rx="7" fill="#eef2ff"/>
  <text x="54" y="117" class="b" fill="#3730a3">Tasks</text>

  <text x="54" y="146" class="b m">Agents</text>
  <text x="54" y="170" class="b m">Activity</text>

  <path d="M 44 190 L 220 190" class="hair"/>

  <path d="M 49 205 L 59 205 L 54 211 Z" fill="#94a3b8"/>
  <text x="64" y="212" class="sm m">web-app</text>

  <!-- draft row -->
  <rect x="42" y="220" width="180" height="54" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="54" y="240" class="b t">add-login-retry</text>
  <rect x="164" y="228" width="46" height="15" rx="7.5" fill="#ede9fe"/>
  <text x="170" y="239" class="xs" fill="#6d28d9">draft</text>
  <circle cx="57" cy="260" r="3.5" fill="#10b981"/>
  <text x="66" y="263" class="sm m">agent · working</text>

  <!-- normal rows -->
  <text x="54" y="296" class="b t">feature/login-fix</text>
  <circle cx="57" cy="312" r="3.5" fill="#cbd5e1"/>
  <text x="66" y="315" class="sm m">1 agent · idle</text>

  <text x="54" y="352" class="b t">feature/jwt-verify</text>
  <circle cx="57" cy="368" r="3.5" fill="#cbd5e1"/>
  <text x="66" y="371" class="sm m">2 agents · idle</text>

  <path d="M 49 397 L 59 397 L 54 403 Z" fill="#94a3b8"/>
  <text x="64" y="404" class="sm m">api</text>
  <text x="54" y="430" class="b t">hotfix/retry-backoff</text>
  <circle cx="57" cy="446" r="3.5" fill="#cbd5e1"/>
  <text x="66" y="449" class="sm m">idle</text>

  <!-- main: chrome -->
  <rect x="246" y="74" width="62" height="22" rx="11" fill="#111827"/>
  <text x="258" y="89" class="sm" fill="#ffffff">GitHub</text>
  <rect x="314" y="74" width="60" height="22" rx="11" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="326" y="89" class="sm m">GitLab</text>
  <rect x="380" y="74" width="46" height="22" rx="11" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="392" y="89" class="sm m">Jira</text>
  <rect x="432" y="74" width="60" height="22" rx="11" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="444" y="89" class="sm m">Linear</text>

  <rect x="600" y="74" width="128" height="22" rx="11" fill="#f3f4f6"/>
  <text x="612" y="89" class="sm m">Search…</text>
  <rect x="736" y="74" width="60" height="22" rx="6" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="746" y="89" class="sm t">+ New</text>

  <text x="246" y="114" class="sm m">web-app · all repos</text>
  <text x="746" y="114" class="sm s">⌘F</text>

  <!-- list card -->
  <rect x="246" y="126" width="552" height="424" rx="9" class="card"/>
  <path d="M 246 158 L 798 158" class="hair"/>
  <text x="258" y="147" class="xs s">#</text>
  <text x="300" y="147" class="xs s">TITLE</text>
  <text x="606" y="147" class="xs s">LABELS</text>
  <text x="722" y="147" class="xs s">UPDATED</text>

  <text x="258" y="181" class="sm s">#431</text>
  <text x="300" y="181" class="b t">Wire JWT middleware into auth routes</text>
  <rect x="606" y="170" width="46" height="15" rx="7.5" fill="#fee2e2"/>
  <text x="613" y="181" class="xs" fill="#b91c1c">auth</text>
  <text x="722" y="181" class="sm m">12m</text>
  <path d="M 246 192 L 798 192" class="hair"/>

  <text x="258" y="217" class="sm s">#428</text>
  <text x="300" y="217" class="b t">Retry backfill on resume</text>
  <rect x="606" y="206" width="54" height="15" rx="7.5" fill="#fef3c7"/>
  <text x="613" y="217" class="xs" fill="#b45309">queue</text>
  <text x="722" y="217" class="sm m">9m</text>
  <path d="M 246 228 L 798 228" class="hair"/>

  <text x="258" y="253" class="sm s">#412</text>
  <text x="300" y="253" class="b t">Add login auth</text>
  <rect x="606" y="242" width="46" height="15" rx="7.5" fill="#dcfce7"/>
  <text x="613" y="253" class="xs" fill="#15803d">done</text>
  <text x="722" y="253" class="sm m">2h</text>
  <path d="M 246 264 L 798 264" class="hair"/>

  <text x="258" y="289" class="sm s">#405</text>
  <text x="300" y="289" class="b t">Sparse workspace rollout notes</text>
  <rect x="606" y="278" width="60" height="15" rx="7.5" fill="#e0e7ff"/>
  <text x="613" y="289" class="xs" fill="#3730a3">docs</text>
  <text x="722" y="289" class="sm m">1d</text>
  <path d="M 246 300 L 798 300" class="hair"/>

  <text x="258" y="325" class="sm s">#398</text>
  <text x="300" y="325" class="b t">Bump pinned upstream snapshot</text>
  <rect x="606" y="314" width="52" height="15" rx="7.5" fill="#f1f5f9"/>
  <text x="613" y="325" class="xs" fill="#475569">chore</text>
  <text x="722" y="325" class="sm m">3d</text>

  <!-- pagination pinned inside card -->
  <path d="M 246 512 L 798 512" class="hair"/>
  <text x="352" y="535" class="sm m">‹ Previous</text>
  <rect x="432" y="521" width="22" height="20" rx="5" fill="#111827"/>
  <text x="439" y="535" class="sm" fill="#ffffff">1</text>
  <text x="462" y="535" class="sm m">2</text>
  <text x="484" y="535" class="sm m">3</text>
  <text x="506" y="535" class="sm m">…</text>
  <text x="528" y="535" class="sm m">9</text>
  <text x="556" y="535" class="sm m">Next ›</text>

  <!-- dock (page level, outside card) -->
  <rect x="246" y="570" width="552" height="52" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <rect x="246" y="570" width="552" height="52" rx="10" fill="url(#dockGlow)"/>
  <circle cx="268" cy="596" r="7" fill="none" stroke="#6366f1" stroke-width="1.6"/>
  <path d="M 268 592 L 268 600 M 264 596 L 272 596" stroke="#6366f1" stroke-width="1.4"/>
  <text x="284" y="600" class="b m">Describe a task or change…</text>
  <text x="650" y="591" class="xs s">⌘ Enter 发送</text>
  <rect x="712" y="584" width="72" height="26" rx="7" fill="#111827" opacity="0.28"/>
  <text x="726" y="601" class="sm" fill="#ffffff">Send →</text>

  <text x="246" y="642" class="sm s">dock 常驻在图示位置：卡片 flex-1 让出高度，分页条仍钉在卡片内</text>

  <!-- annotation numbers -->
  <circle cx="255" cy="560" r="9" class="num"/><text x="252" y="563" class="numtext">1</text>
  <path d="M 255 569 L 255 576" stroke="#2563eb" stroke-width="1.2"/>
  <circle cx="36" cy="247" r="9" class="num"/><text x="33" y="250" class="numtext">2</text>
  <circle cx="36" cy="412" r="9" class="num"/><text x="33" y="415" class="numtext">3</text>

  <!-- ============ Panel B: expanded dock + preview ============ -->
  <text x="832" y="46" class="cap">② 展开态与预览确认（写 tracker 前必须人工确认）</text>
  <rect x="832" y="56" width="416" height="286" rx="12" class="panel"/>

  <rect x="848" y="76" width="384" height="62" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="860" y="94" class="sm m">给 web-app 建个 issue：登录失败要自动重试三次</text>
  <text x="860" y="112" class="sm s">provider GitHub · repo acme/web-app</text>
  <text x="860" y="128" class="xs s">draft name: add-login-retry   (重名 → -2)</text>

  <rect x="848" y="148" width="72" height="24" rx="6" fill="#ffffff" stroke="#e4e7ec"/>
  <text x="862" y="164" class="sm m">Cancel</text>
  <rect x="928" y="148" width="96" height="24" rx="6" fill="#111827"/>
  <text x="944" y="164" class="sm" fill="#ffffff">Create draft</text>

  <rect x="848" y="186" width="384" height="138" rx="8" fill="#fafafa" stroke="#e4e7ec"/>
  <text x="860" y="204" class="xs s">PREVIEW · 确认后才执行写</text>
  <text x="860" y="226" class="b t">Login retries on auth failure</text>
  <text x="860" y="244" class="sm m">Body: 3 attempts, exponential backoff …</text>
  <rect x="860" y="254" width="48" height="16" rx="8" fill="#fee2e2"/>
  <text x="868" y="266" class="xs" fill="#b91c1c">auth</text>
  <rect x="914" y="254" width="60" height="16" rx="8" fill="#f1f5f9"/>
  <text x="922" y="266" class="xs" fill="#475569">backend</text>
  <text x="860" y="290" class="xs" fill="#b45309">⚠ 同 repo 已有同标题 issue #412 · 复用 / 仍新建</text>
  <rect x="860" y="300" width="72" height="20" rx="5" fill="#dbeafe"/>
  <text x="872" y="314" class="xs" fill="#1d4ed8">复用 #412</text>
  <rect x="940" y="300" width="88" height="20" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="950" y="314" class="xs m">仍新建</text>

  <circle cx="1152" cy="76" r="9" class="num"/><text x="1148" y="79" class="numtext">4</text>

  <!-- ============ Panel C: flow ============ -->
  <text x="832" y="380" class="cap">③ 时序：一句话 → 草稿 → 任务 → 开发工作区</text>
  <rect x="832" y="390" width="416" height="342" rx="12" class="panel"/>

  <rect x="848" y="406" width="180" height="30" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="860" y="425" class="sm t">dock 指令</text>

  <rect x="848" y="452" width="180" height="30" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="860" y="471" class="sm t">草稿 folder workspace</text>

  <rect x="848" y="498" width="180" height="30" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="860" y="517" class="sm t">agent 会话 · scratch cwd</text>

  <rect x="848" y="544" width="180" height="30" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="860" y="563" class="sm t">预览 + 人工确认</text>

  <rect x="848" y="590" width="180" height="30" rx="7" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="860" y="609" class="sm t">写 tracker（RPC / 表单）</text>

  <rect x="848" y="636" width="180" height="30" rx="7" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="860" y="655" class="sm t">回写 linkedTask + context</text>

  <rect x="848" y="682" width="180" height="30" rx="7" fill="#fafafa" stroke="#e4e7ec"/>
  <text x="860" y="701" class="sm t">Use → 开发工作区（后续）</text>

  <path d="M 938 436 L 938 452" stroke="#94a3b8" marker-end="url(#arrow)"/>
  <path d="M 938 482 L 938 498" stroke="#94a3b8" marker-end="url(#arrow)"/>
  <path d="M 938 528 L 938 544" stroke="#94a3b8" marker-end="url(#arrow)"/>
  <path d="M 938 574 L 938 590" stroke="#94a3b8" marker-end="url(#arrow)"/>
  <path d="M 938 620 L 938 636" stroke="#94a3b8" marker-end="url(#arrow)"/>
  <path d="M 938 666 L 938 682" stroke="#94a3b8" marker-end="url(#arrow)"/>

  <text x="1048" y="406" class="h2 t">评审新增的 3 个状态</text>
  <text x="1048" y="428" class="sm m">· issue-created-link-failed</text>
  <text x="1048" y="444" class="xs s">任务建了、链接没写回 → 只补写回</text>
  <text x="1048" y="468" class="sm m">· duplicate-suspected</text>
  <text x="1048" y="484" class="xs s">同标题已存在 → 复用 / 仍新建</text>
  <text x="1048" y="508" class="sm m">· agent-crashed</text>
  <text x="1056" y="524" class="xs s">没产出预览就退出 → 重开会话</text>

  <path d="M 1036 548 L 1036 700" stroke="#eef0f3"/>
  <text x="1048" y="568" class="h2 t">不进计数</text>
  <text x="1048" y="588" class="xs s">工作区计数 · Needs you</text>
  <text x="1048" y="603" class="xs s">Recent · 用量归因</text>
  <text x="1048" y="626" class="xs s">统一走一个 selector，M2b 扩它</text>

  <circle cx="1136" cy="698" r="9" class="num"/><text x="1132" y="701" class="numtext">5</text>

  <!-- footer -->
  <text x="32" y="740" class="sm m">设计示意图（非实现截图）· 依据 README §6.2 / §6.3 / §7.9 与开发计划 T2 · 2026-11-16</text>
  <text x="32" y="762" class="xs s">① dock 常驻位置　② 草稿行（folder workspace + taskDraft）　③ 侧栏分组与 agent 状态点　④ 写 tracker 前必须确认　⑤ 时序与评审新增状态</text>
</svg>
